version: 1

env:
  variables:
    NODE_VERSION: "22"
    NODE_ENV: "production"

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install
    build:
      commands:
        - npm run build
  
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
